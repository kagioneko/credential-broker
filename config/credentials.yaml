default_ttl: 300
max_ttl: 900
cleanup_interval_sec: 10
max_response_bytes: 1048576
max_response_items: 200

rate_limit:
  request_per_min: 20
  execute_per_min: 60

# Detection only (does not block). Findings are emitted as "anomaly_suspected"
# audit events -> the JSONL sink -> NekoGuard.
anomaly:
  enabled: true
  window_sec: 60
  cooldown_sec: 300
  thresholds:
    enumeration: 5       # distinct unknown credential_ids from one client / window
    denied_streak: 5     # forbidden-action denials from one client / window
    expired_replay: 5    # execute on an expired/unknown handle / window
    rate_limit_hits: 3   # rate-limit rejections from one client / window

credentials:
  github_reader:
    provider: dotenv
    secret_name: GITHUB_TOKEN        # .env key. Never exposed to the AI.
    connector: github
    description: "Read-only access to GitHub repositories and issues"
    ttl: 300
    allowed_actions:
      - list_repositories
      - get_repository
      - list_issues
      - get_issue
